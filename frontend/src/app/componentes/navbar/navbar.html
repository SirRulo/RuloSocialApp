<nav class="navbar">
  <a class="marca" routerLink="/publicaciones">RULO<span>SOCIAL</span></a>

  <div class="links">
    <!-- auth.usuario() es un signal: cuando cambia (login/salir), esta parte se vuelve a dibujar -->
    @if (auth.usuario()) {
      <!-- routerLinkActive agrega la clase 'activo' cuando la URL coincide con el link -->
      <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
      <a routerLink="/perfil" routerLinkActive="activo">Mi perfil</a>
      <span class="usuario">&#64;{{ auth.usuario()?.nombreUsuario }}</span>
      <button class="secundario" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="activo">Ingresar</a>
      <a routerLink="/registro" routerLinkActive="activo">Registrarse</a>
    }
  </div>
</nav>
